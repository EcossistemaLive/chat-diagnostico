<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Julio | Concierge Digital Live Consultoria</title>
  <meta name="description" content="Fale com o Julio, seu consultor digital para diagnóstico empresarial M.A.P.C.A." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Tela de login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="avatar login-avatar">J</div>
      <h1>Julio</h1>
      <p class="login-subtitle">Concierge digital da Live Consultoria</p>
      
      <p style="font-size: 0.9rem; margin-bottom: 20px; color: var(--text-muted);">
        Para iniciarmos seu diagnóstico, por favor faça o login com o seu telefone e a senha padrão fornecida pela equipe.
      </p>

      <form id="form-cliente" class="login-form">
        <label>Telefone cadastrado</label>
        <input type="tel" id="cliente-phone" placeholder="(11) 99999-9999" autocomplete="tel" required />
        <label>Senha</label>
        <input type="password" id="cliente-password" placeholder="Sua senha" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary login-submit" id="btn-login">Entrar</button>
      </form>

      <p class="login-error hidden" id="login-error"></p>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-screen" class="chat-screen hidden">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="avatar header-avatar">J</div>
        <div>
          <h1>Julio</h1>
          <span><span class="status-dot"></span>online • <span id="user-name">Concierge Live Consultoria</span></span>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn danger" id="logout-btn" title="Sair">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-body" id="chat-body">
      <div class="messages-inner" id="messages">
        <!-- As mensagens aparecem aqui -->
      </div>
      
      <!-- Indicador de digitação -->
      <div class="typing-indicator hidden" id="typing-indicator">
        <div class="avatar small">J</div>
        <div class="bubble bot typing">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </main>

    <footer class="chat-footer">
      <!-- Múltipla Escolha / Inputs Especiais -->
      <div id="quick-replies" class="quick-replies hidden"></div>

      <div class="input-wrapper" id="input-wrapper">
        <textarea id="msg-input" placeholder="Escreva sua resposta... (Enter para enviar)" rows="1" maxlength="1000"></textarea>
        <button id="send-btn" title="Enviar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="disclaimer">Julio é um assistente virtual da Live Consultoria baseado na metodologia M.A.P.C.A.</p>
    </footer>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
